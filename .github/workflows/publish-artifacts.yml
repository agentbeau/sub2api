name: publish tested artifacts

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

permissions: {}

concurrency:
  group: sub2api-artifacts-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
  cancel-in-progress: false

jobs:
  # This job checks GitHub's API before a job with write permission checks out
  # or executes any repository code. The event's name alone is not trusted.
  validate:
    if: github.repository == 'agentbeau/sub2api' && github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      revision: ${{ steps.source.outputs.revision }}
      run_id: ${{ steps.source.outputs.run_id }}
      run_attempt: ${{ steps.source.outputs.run_attempt }}
    steps:
      - name: Validate the completed source run using read-only API access
        id: source
        uses: actions/github-script@v7
        with:
          script: |
            const owner = 'agentbeau';
            const repo = 'sub2api';
            const repositoryId = 1453664051;
            const runId = context.payload.workflow_run.id;
            if (!Number.isSafeInteger(runId) || runId <= 0) throw new Error('Invalid source run ID');
            const [{ data: workflow }, { data: run }, { data: main }] = await Promise.all([
              github.rest.actions.getWorkflow({ owner, repo, workflow_id: 'ci.yml' }),
              github.rest.actions.getWorkflowRun({ owner, repo, run_id: runId }),
              github.rest.git.getRef({ owner, repo, ref: 'heads/main' }),
            ]);
            const trustedRepo = value => value?.id === repositoryId && value.full_name === `${owner}/${repo}`;
            const expectedPath = '.github/workflows/ci.yml';
            if (!trustedRepo(run.repository) || !trustedRepo(run.head_repository)) throw new Error('Untrusted source repository');
            if (workflow.path !== expectedPath || workflow.state !== 'active' ||
                !Number.isSafeInteger(workflow.id) || workflow.id <= 0 ||
                run.workflow_id !== workflow.id || run.path !== expectedPath) throw new Error('Unexpected source workflow');
            if (run.id !== runId || !Number.isSafeInteger(run.run_attempt) || run.run_attempt <= 0 ||
                run.event !== 'push' || run.head_branch !== 'main' || run.status !== 'completed' ||
                run.conclusion !== 'success' || !/^[a-f0-9]{40}$/.test(run.head_sha ?? '')) throw new Error('Source CI did not pass for a main push');
            if (main.ref !== 'refs/heads/main' || main.object?.type !== 'commit' ||
                main.object.sha !== run.head_sha) throw new Error('Source revision is no longer current main');
            core.setOutput('revision', run.head_sha);
            core.setOutput('run_id', run.id);
            core.setOutput('run_attempt', run.run_attempt);

  publish:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          repository: agentbeau/sub2api
          ref: ${{ needs.validate.outputs.revision }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # No dependencies or build scripts run in this write-capable job. The
      # publisher copies the original CI ZIPs and verifies their API digests.
      - name: Publish exact tested archives
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SUB2API_CI_RUN_ID: ${{ needs.validate.outputs.run_id }}
          SUB2API_CI_RUN_ATTEMPT: ${{ needs.validate.outputs.run_attempt }}
          SUB2API_CI_REVISION: ${{ needs.validate.outputs.revision }}
        run: node scripts/publish-ci-artifacts.mjs
