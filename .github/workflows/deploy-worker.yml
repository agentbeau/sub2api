name: deploy worker

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  checks:
    if: github.event_name != 'workflow_run'
    uses: ./.github/workflows/ci.yml

  target:
    needs: [checks]
    if: >-
      always() &&
      ((github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository) ||
      (github.event_name == 'workflow_dispatch' && needs.checks.result == 'success'))
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.installation.outputs.ready }}
    env:
      CHECKED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check the intended main revision
        id: revision
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/check-main-revision.mjs
      # Keep the other installation out of the shared queue: GitHub retains only one pending job.
      - name: Select the existing installation
        id: installation
        if: steps.revision.outputs.current == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TARGET_INSTALL: worker
          EVENT_NAME: ${{ github.event_name }}
        run: node scripts/check-installation.mjs

  deploy:
    needs: [target]
    if: needs.target.outputs.ready == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: sub2api-production
      cancel-in-progress: false
    env:
      CHECKED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Recheck the installation inside the production lock
        id: installation
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TARGET_INSTALL: worker
          EVENT_NAME: ${{ github.event_name }}
        run: node scripts/check-installation.mjs
      - if: steps.installation.outputs.ready == 'true'
        uses: actions/download-artifact@v4
        with:
          name: worker-only
          path: .wrangler/artifacts/worker-only
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id || github.run_id }}
      - if: steps.installation.outputs.ready == 'true'
        run: npm ci
      - name: Reject a revision superseded during preparation
        id: final_revision
        if: steps.installation.outputs.ready == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/check-main-revision.mjs
      - name: Deploy the prepared Workers-only alternative
        id: deploy
        if: steps.final_revision.outputs.current == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SUB2API_DASHBOARD_PASSWORD: ${{ secrets.SUB2API_DASHBOARD_PASSWORD }}
          SUB2API_MANAGEMENT_KEY: ${{ secrets.SUB2API_MANAGEMENT_KEY }}
        run: node scripts/deploy-prepared.mjs worker .wrangler/artifacts/worker-only
      - name: Check runtime readiness and configured authentication
        if: steps.deploy.outcome == 'success'
        timeout-minutes: 8
        env:
          SUB2API_URL: ${{ steps.deploy.outputs.url }}
          SUB2API_INSTALL: worker
          SUB2API_KEY: ${{ secrets.SUB2API_WORKER_TEST_KEY || secrets.SUB2API_FREE_TEST_KEY || secrets.SUB2API_TEST_KEY }}
        run: node scripts/check-deployed.mjs
