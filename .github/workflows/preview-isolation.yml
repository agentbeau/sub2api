name: preview isolation
on:
  pull_request:
    paths:
      - 'src/preview*'
      - 'test/preview*'
      - 'scripts/preview-*'
      - 'wrangler.preview.jsonc'
      - '.github/workflows/preview-isolation.yml'
  push:
    branches: ['dagul/isolated-worker-preview']
permissions:
  contents: read
jobs:
  isolation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node --test scripts/preview-guard.test.mjs scripts/preview-builds.test.mjs
      - run: npx vitest run test/preview-access.test.ts
