name: ci

on:
  push:
    branches: [main, dagul/isolated-worker-preview]
  pull_request:
  workflow_call:

permissions:
  contents: read

# A branch update is checked through its PR, not through both push and PR events.
# Superseded PR checks can stop; main/reusable deployment checks are not interrupted.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install the pinned Rust and Wasm tools
        run: |
          rustup toolchain install 1.99.1 --profile minimal --target wasm32-unknown-unknown
          tool_dir="$RUNNER_TEMP/wasm-bindgen"
          mkdir -p "$tool_dir"
          curl --fail --location --retry 3 --output "$tool_dir/tool.tar.gz" https://github.com/wasm-bindgen/wasm-bindgen/releases/download/0.2.130/wasm-bindgen-0.2.130-x86_64-unknown-linux-musl.tar.gz
          printf '%s  %s\n' 9687f3bb551b9f66f37ed32a40d7913a00f7962db653054e56857bc306c3227f "$tool_dir/tool.tar.gz" | sha256sum --check
          tar -xzf "$tool_dir/tool.tar.gz" --strip-components=1 -C "$tool_dir"
          echo "$tool_dir" >> "$GITHUB_PATH"
          "$tool_dir/wasm-bindgen" --version
      - run: npm ci
      - run: npm run verify
      - name: Verify deployment safeguards
        run: node --test scripts/deployment.test.mjs scripts/deploy-prepared.test.mjs scripts/cloudflare-builds.test.mjs scripts/consume-ci-artifacts.test.mjs scripts/publish-ci-artifacts.test.mjs container/brand-panel/brand.test.mjs
      - name: Exercise the compiled isolated preview boundary
        if: github.head_ref == 'dagul/isolated-worker-preview' || github.ref_name == 'dagul/isolated-worker-preview'
        run: |
          node --test scripts/preview-guard.test.mjs scripts/preview-builds.test.mjs scripts/consume-preview-artifacts.test.mjs scripts/publish-preview-artifacts.test.mjs
          npx esbuild src/preview.ts --bundle --format=esm --platform=neutral --target=esnext '--conditions=workerd,worker,browser' '--external:cloudflare:*' --loader:.wasm=copy --outfile=.wrangler/preview-runtime/preview.js
          node scripts/preview-runtime.mjs .wrangler/preview-runtime/preview.js
      - name: Package tested isolated preview
        if: github.head_ref == 'dagul/isolated-worker-preview' || github.ref_name == 'dagul/isolated-worker-preview'
        run: node scripts/package-preview.mjs
      - uses: actions/upload-artifact@v4
        if: github.head_ref == 'dagul/isolated-worker-preview' || github.ref_name == 'dagul/isolated-worker-preview'
        with:
          name: isolated-preview
          path: .wrangler/artifacts/isolated-preview
          include-hidden-files: true
          if-no-files-found: error
          overwrite: true
          retention-days: 14
      - name: Package the compiled container gateway
        run: node scripts/prepare-deployment.mjs container .wrangler/artifacts/container-worker
      - name: Exercise source gateway streaming and WebSockets in workerd
        run: npm run test:runtime
      - name: Exercise the packaged gateway in workerd
        run: npm run test:runtime -- .wrangler/artifacts/container-worker/worker/index.js
      - name: Fetch the Workers-only dashboard
        env:
          PANEL_VERSION: ${{ vars.PANEL_VERSION }}
          PANEL_SHA256: ${{ vars.PANEL_SHA256 }}
        run: node worker/scripts/fetch-panel.mjs
      - name: Package the Workers-only alternative
        run: node scripts/prepare-deployment.mjs worker .wrangler/artifacts/worker-only
      - uses: actions/upload-artifact@v4
        with:
          name: container-worker
          path: .wrangler/artifacts/container-worker
          include-hidden-files: true
          if-no-files-found: error
          overwrite: true
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: worker-only
          path: .wrangler/artifacts/worker-only
          include-hidden-files: true
          if-no-files-found: error
          overwrite: true
          retention-days: 14

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # No Cloudflare/GitHub credentials reach npm lifecycle scripts or the upstream CPA build.
      - name: Build and smoke-test the exact provider image
        env:
          CPA_VERSION: ${{ vars.CPA_VERSION }}
          PANEL_VERSION: ${{ vars.PANEL_VERSION }}
          PANEL_SHA256: ${{ vars.PANEL_SHA256 }}
        run: node scripts/build-container-image.mjs .wrangler/artifacts/container-image
      - name: Exercise the same image with host networking
        env:
          SUB2API_DOCKER_NETWORK: host
        run: |
          IMAGE="$(node -e 'const fs = require("node:fs"); process.stdout.write(JSON.parse(fs.readFileSync(".wrangler/artifacts/container-image/manifest.json", "utf8")).image)')"
          export IMAGE
          sh test/container-smoke.sh --prebuilt
      - uses: actions/upload-artifact@v4
        with:
          name: container-image
          path: .wrangler/artifacts/container-image
          include-hidden-files: true
          if-no-files-found: error
          overwrite: true
          compression-level: 0
          retention-days: 14
