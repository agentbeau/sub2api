name: publish tested preview artifacts
on:
  push:
    branches: [dagul/isolated-worker-preview]
permissions: {}
concurrency:
  group: sub2api-preview-artifacts-${{ github.sha }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    permissions:
      contents: read
      actions: read
    outputs:
      run_id: ${{ steps.source.outputs.run_id }}
      run_attempt: ${{ steps.source.outputs.run_attempt }}
    steps:
      - name: Wait for exact-commit successful preview CI
        id: source
        uses: actions/github-script@v7
        with:
          script: |
            const owner = 'agentbeau', repo = 'sub2api', branch = 'dagul/isolated-worker-preview';
            const sha = context.sha;
            if (context.repo.owner !== owner || context.repo.repo !== repo || context.ref !== `refs/heads/${branch}`) throw new Error('Unexpected publication source');
            const {data: workflow} = await github.rest.actions.getWorkflow({owner, repo, workflow_id:'ci.yml'});
            if (workflow.path !== '.github/workflows/ci.yml' || workflow.state !== 'active') throw new Error('Unexpected CI workflow');
            for (let n = 0; n < 32; n++) {
              const {data} = await github.rest.actions.listWorkflowRuns({owner, repo, workflow_id:workflow.id, branch, event:'push', head_sha:sha, per_page:10});
              const run = data.workflow_runs.sort((a,b)=>b.id-a.id)[0];
              if (run?.status === 'completed') {
                if (run.conclusion !== 'success' || run.head_sha !== sha || run.head_branch !== branch || run.event !== 'push' || run.workflow_id !== workflow.id || run.path !== workflow.path || run.repository?.id !== 1453664051 || run.head_repository?.id !== 1453664051) throw new Error('CI not successful or wrong provenance');
                core.setOutput('run_id', run.id); core.setOutput('run_attempt', run.run_attempt); return;
              }
              await new Promise(resolve=>setTimeout(resolve,30000));
            }
            throw new Error('Timed out waiting for exact CI');
  publish:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Publish checksummed exact CI archives
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SUB2API_CI_RUN_ID: ${{ needs.validate.outputs.run_id }}
          SUB2API_CI_RUN_ATTEMPT: ${{ needs.validate.outputs.run_attempt }}
          SUB2API_CI_REVISION: ${{ github.sha }}
        run: node scripts/publish-preview-artifacts.mjs
