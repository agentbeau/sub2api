[package]
name = "sub2api-gateway"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "sub2api_gateway"
crate-type = ["cdylib", "rlib"]

[dependencies]
base64 = "=0.22.1"
hmac = "=0.12.1"
sha2 = "=0.10.9"
subtle = "=2.6.1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "=0.3.107"
wasm-bindgen = "=0.2.130"
wasm-bindgen-futures = "=0.4.80"
web-sys = { version = "=0.3.107", features = ["Headers", "ReadableStream", "ReadableStreamDefaultReader", "Request", "RequestInit", "Response", "ResponseInit", "Url", "UrlSearchParams"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = "debuginfo"
